project:
  type: website
  output-dir: _site
  resources:
    - pdf/
    - videos/
    - figuras/
    - recursos/explorador-pasividad.js
    - recursos/explorador-fundamentos.js
    - recursos/explorador-ciclos.js
    - recursos/explorador-linealizacion.js
    - recursos/explorador-lyapunov.js
    - recursos/explorador-bidimensional.js
    - recursos/explorador-introduccion.js
    - recursos/explorador-unidimensional.js

lang: es

website:
  title: "Sistemas No Lineales"
  description: "Notas, códigos MATLAB/Simulink, videos y actividades del curso IELE 4311 · Universidad de los Andes"
  site-url: https://quijanon-bot.github.io/NQuijano.github.io/curso-sisnl
  repo-url: https://github.com/quijanon-bot/NQuijano.github.io
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    pinned: true
    background: "#14213D"
    left:
      - href: index.qmd
        text: Inicio
      - text: Partes del curso
        menu:
          - partes/01-introduccion.qmd
          - partes/02-unidimensionales.qmd
          - partes/03-preliminares.qmd
          - partes/04-bidimensionales.qmd
          - partes/05-orbitas-ciclos.qmd
          - partes/06-bifurcaciones.qmd
          - partes/07-lyapunov.qmd
          - partes/08-invarianza.qmd
          - partes/09-variantes.qmd
          - partes/10-estabilidad-avanzada.qmd
          - partes/11-pasividad.qmd
          - partes/12-linealizacion.qmd
      - href: notacion.qmd
        text: Notación
      - href: codigos.qmd
        text: Códigos
      - href: videos.qmd
        text: Videos
    right:
      - icon: house-door
        text: Nicanor Quijano
        href: https://quijanon-bot.github.io/NQuijano.github.io/
      - icon: github
        href: https://github.com/quijanon-bot/NQuijano.github.io/tree/main/fuentes/curso-sisnl
  page-footer:
    left: "[Nicanor Quijano](https://quijanon-bot.github.io/NQuijano.github.io/) · Departamento de Ingeniería Eléctrica y Electrónica · Universidad de los Andes"
    right: "Hecho con [Quarto](https://quarto.org)"

filters:
  - recursos/incluir-codigo.lua

format:
  html:
    theme: [cosmo, recursos/estilos.scss]
    toc: true
    toc-title: "En esta página"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    html-math-method: mathjax
    include-in-header: recursos/macros.html
    fig-align: center
